<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky Fly Dash - MEGA HARD (MILD) Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #111;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
    }
    /* スマホ画面に合わせて自動リサイズされるように修正 */
    #game-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      box-shadow: 0 0 30px rgba(0,255,255,0.3);
      overflow: hidden;
      border-radius: 8px;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #101426;
      touch-action: none; /* スマホでのスクロールやズームを防止 */
    }
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(10, 10, 20, 0.92);
      gap: 20px;
      z-index: 10;
    }
    .hidden {
      display: none !important;
    }
    h1 {
      font-size: 38px;
      color: #00fff0;
      text-shadow: 0 0 12px #00fff0;
    }
    p {
      color: #aaa;
      text-align: center;
      line-height: 1.6;
    }
    .btn-container {
      display: flex;
      gap: 15px;
    }
    button {
      padding: 14px 24px;
      font-size: 16px;
      font-weight: bold;
      background: linear-gradient(45deg, #00d2ff, #3a7bd5);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    button:hover {
      transform: scale(1.05);
    }
    button.normal-btn {
      background: linear-gradient(45deg, #ff007f, #7f00ff);
    }
    button.megahard-btn {
      background: linear-gradient(45deg, #ff0000, #ff8c00);
      box-shadow: 0 0 10px #ff0000;
    }
    #hud {
      position: absolute;
      top: 15px;
      left: 0;
      width: 100%;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
    }
    #progress-container {
      width: 55%;
      height: 10px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    #progress-bar {
      width: 0%;
      height: 100%;
      background: #00ff66;
      box-shadow: 0 0 8px #00ff66;
    }
    #score-display {
      font-size: 16px;
      font-weight: bold;
      color: #ffd700;
    }
  </style>
</head>
<body>

<div id="game-container">
  <!-- キャンバスの内部解像度は800x450のまま固定（見た目だけCSSで縮小・拡大される） -->
  <canvas id="canvas" width="800" height="450"></canvas>

  <div id="hud" class="hidden">
    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>
    <div id="score-display">COINS: 0</div>
  </div>

  <div id="select-screen" class="screen">
    <h1>SKY FLY DASH</h1>
    <p>長押しで飛行（ゲージ消費）/ 地面・足場で充電<br>Hard限定：緑の「ジャンプパッド」で超大ジャンプ！<br>MEGA HARD限定：紫の「ポータル」で重力が反転！(マイルド調整版)</p>
    <div class="btn-container">
      <button onclick="startGame(1)">Stage 1 (EASY)</button>
      <button class="normal-btn" onclick="startGame(2)">Stage 2 (HARD)</button>
      <button class="megahard-btn" onclick="startGame(3)">Stage 3 (MEGA HARD)</button>
    </div>
  </div>

  <div id="result-screen" class="screen hidden">
    <h1 id="result-title">GAME OVER</h1>
    <p id="result-detail">進行度: 0%</p>
    <button onclick="showMenu()">ステージ選択へ</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const GRAVITY = 0.42;
const THRUST = -0.85;
const FLOOR_Y = 370;
const CEILING_Y = 0;
const STAGE_DURATION_SEC = 90;
const FIXED_SPEED = 8.0; // スクロール速度を2倍(4.0 -> 8.0)に変更
const TOTAL_DISTANCE = STAGE_DURATION_SEC * 60 * FIXED_SPEED; // 全長 43,200px

const BGM_STAGE_1 = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3');
const BGM_STAGE_2 = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3');
const BGM_STAGE_3 = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3');
BGM_STAGE_1.loop = true;
BGM_STAGE_2.loop = true;
BGM_STAGE_3.loop = true;

let currentAudio = null;
let gameState = 'MENU';
let currentStage = 1;
let startTime = 0;
let cameraX = 0;
let isHolding = false;
let coinsCollected = 0;

// === スピード固定用の変数を追加 ===
let lastTime = 0;
let accumulator = 0;
const TIME_STEP = 1000 / 60; // 60FPS（約16.66ms）に固定

const player = {
  x: 150,
  y: FLOOR_Y - 16,
  radius: 16,
  vy: 0,
  energy: 100,
  maxEnergy: 100,
  isGrounded: false,
  gravityMultiplier: 1,
  reset() {
    this.y = FLOOR_Y - this.radius;
    this.vy = 0;
    this.energy = 100;
    this.isGrounded = true;
    this.gravityMultiplier = 1;
  }
};

let obstacles = [];
let items = [];

// 操作イベント
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') isHolding = true;
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') isHolding = false;
});
canvas.addEventListener('mousedown', () => isHolding = true);
window.addEventListener('mouseup', () => isHolding = false);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); isHolding = true; }, { passive: false });
window.addEventListener('touchend', () => isHolding = false);

function spawnFixedPattern(patternType, startX) {
  switch(patternType) {
    case 0:
      obstacles.push({ type: 'spike', x: startX, y: FLOOR_Y, size: 30 });
      obstacles.push({ type: 'block', x: startX + 220, y: FLOOR_Y - 120, w: 140, h: 20 });
      items.push({ type: 'coin', x: startX + 290, y: FLOOR_Y - 150, collected: false });
      return 550;
    case 1:
      obstacles.push({ type: 'spike', x: startX + 50, y: CEILING_Y, size: 30, isCeiling: true });
      obstacles.push({ type: 'block', x: startX + 200, y: FLOOR_Y - 80, w: 160, h: 20 });
      return 550;
    case 2:
      obstacles.push({ type: 'block', x: startX + 100, y: 0, w: 60, h: 180 });
      obstacles.push({ type: 'spike', x: startX + 280, y: FLOOR_Y, size: 30 });
      items.push({ type: 'potion', x: startX + 130, y: 290, collected: false });
      return 580;
    case 3:
      obstacles.push({ type: 'spike', x: startX, y: FLOOR_Y, size: 30 });
      obstacles.push({ type: 'spike', x: startX + 35, y: FLOOR_Y, size: 30 });
      obstacles.push({ type: 'block', x: startX + 240, y: FLOOR_Y - 150, w: 120, h: 20 });
      items.push({ type: 'coin', x: startX + 300, y: FLOOR_Y - 190, collected: false });
      return 580;
    case 4:
      obstacles.push({ type: 'spike', x: startX + 50, y: CEILING_Y, size: 30, isCeiling: true });
      obstacles.push({ type: 'spike', x: startX + 50, y: FLOOR_Y, size: 30 });
      obstacles.push({ type: 'block', x: startX + 250, y: FLOOR_Y - 110, w: 120, h: 20 });
      return 580;
    case 5:
      obstacles.push({ type: 'block', x: startX, y: 0, w: 80, h: 160 });
      obstacles.push({ type: 'block', x: startX, y: FLOOR_Y - 80, w: 80, h: 80 });
      items.push({ type: 'coin', x: startX + 40, y: 225, collected: false });
      return 550;

    // --- Hard拡張ギミックパターン ---
    case 6:
      obstacles.push({ type: 'jumppad', x: startX, y: FLOOR_Y - 12, w: 60, h: 12 });
      obstacles.push({ type: 'spike', x: startX + 100, y: FLOOR_Y, size: 30 });
      obstacles.push({ type: 'spike', x: startX + 135, y: FLOOR_Y, size: 30 });
      obstacles.push({ type: 'spike', x: startX + 170, y: FLOOR_Y, size: 30 });
      obstacles.push({ type: 'block', x: startX + 220, y: FLOOR_Y - 210, w: 150, h: 20 });
      items.push({ type: 'coin', x: startX + 295, y: FLOOR_Y - 250, collected: false });
      return 600;
    case 7:
      obstacles.push({ type: 'spike', x: startX + 120, y: CEILING_Y, size: 30, isCeiling: true });
      obstacles.push({ type: 'jumppad', x: startX + 80, y: FLOOR_Y - 12, w: 50, h: 12 });
      obstacles.push({ type: 'block', x: startX + 260, y: FLOOR_Y - 130, w: 140, h: 20 });
      items.push({ type: 'potion', x: startX + 330, y: FLOOR_Y - 170, collected: false });
      return 580;
    case 8:
      obstacles.push({ type: 'jumppad', x: startX, y: FLOOR_Y - 12, w: 50, h: 12 });
      obstacles.push({ type: 'block', x: startX + 180, y: 0, w: 70, h: 220 });
      obstacles.push({ type: 'jumppad', x: startX + 320, y: FLOOR_Y - 12, w: 50, h: 12 });
      items.push({ type: 'coin', x: startX + 100, y: FLOOR_Y - 180, collected: false });
      return 620;
    case 9:
      obstacles.push({ type: 'spike', x: startX, y: FLOOR_Y, size: 30 });
      obstacles.push({ type: 'spike', x: startX + 35, y: FLOOR_Y, size: 30 });
      obstacles.push({ type: 'spike', x: startX + 70, y: FLOOR_Y, size: 30 });
      obstacles.push({ type: 'block', x: startX + 160, y: FLOOR_Y - 100, w: 100, h: 20 });
      obstacles.push({ type: 'block', x: startX + 300, y: FLOOR_Y - 180, w: 100, h: 20 });
      items.push({ type: 'coin', x: startX + 350, y: FLOOR_Y - 220, collected: false });
      return 600;
    case 10:
      obstacles.push({ type: 'jumppad', x: startX, y: FLOOR_Y - 12, w: 50, h: 12 });
      obstacles.push({ type: 'block', x: startX + 120, y: 0, w: 180, h: 180 });
      obstacles.push({ type: 'block', x: startX + 120, y: FLOOR_Y - 60, w: 180, h: 60 });
      items.push({ type: 'potion', x: startX + 200, y: FLOOR_Y - 120, collected: false });
      return 580;
    case 11:
      obstacles.push({ type: 'spike', x: startX, y: FLOOR_Y, size: 30 });
      obstacles.push({ type: 'spike', x: startX + 120, y: CEILING_Y, size: 30, isCeiling: true });
      obstacles.push({ type: 'spike', x: startX + 240, y: FLOOR_Y, size: 30 });
      obstacles.push({ type: 'spike', x: startX + 360, y: CEILING_Y, size: 30, isCeiling: true });
      items.push({ type: 'coin', x: startX + 180, y: FLOOR_Y - 150, collected: false });
      return 600;
    case 12:
      obstacles.push({ type: 'jumppad', x: startX, y: FLOOR_Y - 12, w: 60, h: 12 });
      obstacles.push({ type: 'spike', x: startX + 120, y: FLOOR_Y, size: 30 });
      obstacles.push({ type: 'spike', x: startX + 155, y: FLOOR_Y, size: 30 });
      obstacles.push({ type: 'spike', x: startX + 190, y: FLOOR_Y, size: 30 });
      obstacles.push({ type: 'spike', x: startX + 225, y: FLOOR_Y, size: 30 });
      obstacles.push({ type: 'block', x: startX + 320, y: FLOOR_Y - 100, w: 100, h: 20 });
      return 600;
    case 13:
      obstacles.push({ type: 'block', x: startX, y: 0, w: 80, h: 260 });
      obstacles.push({ type: 'jumppad', x: startX + 120, y: FLOOR_Y - 12, w: 60, h: 12 });
      obstacles.push({ type: 'spike', x: startX + 240, y: CEILING_Y, size: 30, isCeiling: true });
      items.push({ type: 'coin', x: startX + 150, y: FLOOR_Y - 160, collected: false });
      return 580;
    case 14:
      obstacles.push({ type: 'spike', x: startX, y: FLOOR_Y, size: 30 });
      obstacles.push({ type: 'jumppad', x: startX + 80, y: FLOOR_Y - 12, w: 50, h: 12 });
      obstacles.push({ type: 'block', x: startX + 180, y: FLOOR_Y - 160, w: 80, h: 20 });
      obstacles.push({ type: 'spike', x: startX + 290, y: CEILING_Y, size: 30, isCeiling: true });
      items.push({ type: 'potion', x: startX + 220, y: FLOOR_Y - 200, collected: false });
      return 580;

    // --- MEGA HARD用 反転拡張ギミックパターン（マイルド調整） ---
    case 15: 
      obstacles.push({ type: 'portal', x: startX, w: 40, activated: false });
      items.push({ type: 'coin', x: startX + 150, y: CEILING_Y + 50, collected: false });
      return 600; // 間隔を広げる
    case 16: 
      obstacles.push({ type: 'spike', x: startX, y: CEILING_Y, size: 30, isCeiling: true });
      obstacles.push({ type: 'block', x: startX + 200, y: CEILING_Y + 120, w: 120, h: 20 }); // トゲを減らして優しく
      return 600;
    case 17: 
      obstacles.push({ type: 'portal', x: startX, w: 40, activated: false });
      obstacles.push({ type: 'spike', x: startX + 150, y: FLOOR_Y, size: 30 });
      return 600;
    case 18: 
      obstacles.push({ type: 'jumppad', x: startX, y: CEILING_Y, w: 60, h: 12, isCeiling: true });
      obstacles.push({ type: 'spike', x: startX + 120, y: CEILING_Y, size: 30, isCeiling: true });
      obstacles.push({ type: 'block', x: startX + 250, y: CEILING_Y + 150, w: 100, h: 20 });
      items.push({ type: 'coin', x: startX + 300, y: CEILING_Y + 190, collected: false });
      return 650;
    case 19: 
      obstacles.push({ type: 'portal', x: startX, w: 40, activated: false });
      obstacles.push({ type: 'block', x: startX + 140, y: 150, w: 40, h: 80 }); 
      obstacles.push({ type: 'portal', x: startX + 280, w: 40, activated: false });
      obstacles.push({ type: 'spike', x: startX + 380, y: FLOOR_Y, size: 30 });
      return 700;
    case 20: 
      obstacles.push({ type: 'block', x: startX, y: 0, w: 80, h: 100 });
      obstacles.push({ type: 'block', x: startX + 220, y: FLOOR_Y - 130, w: 80, h: 130 });
      items.push({ type: 'potion', x: startX + 300, y: 200, collected: false });
      return 700;
    case 21: 
      obstacles.push({ type: 'block', x: startX, y: CEILING_Y + 80, w: 160, h: FLOOR_Y - 80 });
      items.push({ type: 'coin', x: startX + 90, y: CEILING_Y + 40, collected: false });
      return 600;
    case 22: 
      obstacles.push({ type: 'block', x: startX, y: 0, w: 180, h: 180 }); 
      obstacles.push({ type: 'portal', x: startX + 250, w: 40, activated: false });
      obstacles.push({ type: 'spike', x: startX + 350, y: CEILING_Y, size: 30, isCeiling: true }); 
      return 650;
    case 23: 
      obstacles.push({ type: 'jumppad', x: startX, y: CEILING_Y, w: 50, h: 12, isCeiling: true });
      obstacles.push({ type: 'block', x: startX + 150, y: CEILING_Y + 150, w: 80, h: 20 });
      items.push({ type: 'coin', x: startX + 100, y: CEILING_Y + 80, collected: false });
      return 600;
    case 24: 
      obstacles.push({ type: 'portal', x: startX, w: 30, activated: false });
      obstacles.push({ type: 'portal', x: startX + 180, w: 30, activated: false });
      items.push({ type: 'potion', x: startX + 90, y: 150, collected: false });
      return 600;
    case 25: 
      obstacles.push({ type: 'spike', x: startX, y: CEILING_Y, size: 30, isCeiling: true });
      obstacles.push({ type: 'spike', x: startX + 35, y: CEILING_Y, size: 30, isCeiling: true });
      obstacles.push({ type: 'block', x: startX + 160, y: CEILING_Y + 80, w: 100, h: 20 });
      items.push({ type: 'coin', x: startX + 210, y: CEILING_Y + 130, collected: false });
      return 600;
    case 26: 
      obstacles.push({ type: 'portal', x: startX, w: 30, activated: false }); 
      obstacles.push({ type: 'spike', x: startX + 100, y: CEILING_Y, size: 30, isCeiling: true });
      obstacles.push({ type: 'spike', x: startX + 135, y: CEILING_Y, size: 30, isCeiling: true });
      obstacles.push({ type: 'block', x: startX + 250, y: CEILING_Y + 150, w: 150, h: 20 });
      return 650;
    case 27: 
      obstacles.push({ type: 'portal', x: startX, w: 30, activated: false });
      obstacles.push({ type: 'jumppad', x: startX + 120, y: FLOOR_Y - 12, w: 60, h: 12 });
      obstacles.push({ type: 'block', x: startX + 220, y: FLOOR_Y - 180, w: 100, h: 20 });
      items.push({ type: 'coin', x: startX + 270, y: FLOOR_Y - 220, collected: false });
      return 600;
    case 28: 
      obstacles.push({ type: 'portal', x: startX, w: 30, activated: false });
      obstacles.push({ type: 'spike', x: startX + 120, y: FLOOR_Y, size: 30 });
      obstacles.push({ type: 'portal', x: startX + 280, w: 30, activated: false }); 
      obstacles.push({ type: 'spike', x: startX + 380, y: CEILING_Y, size: 30, isCeiling: true }); 
      return 650;
    case 29: 
      obstacles.push({ type: 'block', x: startX, y: FLOOR_Y - 140, w: 80, h: 140 });
      items.push({ type: 'coin', x: startX + 40, y: 150, collected: false });
      return 600;
    case 30: 
      obstacles.push({ type: 'portal', x: startX, w: 40, activated: false });
      obstacles.push({ type: 'spike', x: startX + 180, y: CEILING_Y, size: 30, isCeiling: true });
      obstacles.push({ type: 'portal', x: startX + 360, w: 40, activated: false });
      return 750;
    default:
      return 600;
  }
}

function buildFullStage(stageId) {
  obstacles = [];
  items = [];
  coinsCollected = 0;

  const sequenceEasy = [
    0, 1, 2, 3, 5, 0, 4, 1, 2, 3, 5, 0, 1, 4, 2, 3, 0, 5, 1, 4,
    2, 3, 5, 0, 1, 4, 2, 3, 0, 5, 1, 4, 2, 3, 5, 0, 1, 4, 2, 3
  ];
  const sequenceHard = [
    0, 6, 1, 9, 2, 7, 5, 10, 3, 11, 6, 4, 8, 12, 1, 7, 9, 13, 5, 10,
    11, 2, 6, 12, 3, 8, 4, 13, 7, 9, 10, 11, 6, 12, 13, 8, 14, 11, 12, 14
  ];
  // MEGA HARDのシーケンスも少しゆったりしたパターン構成に調整
  const sequenceMegaHard = [
    15, 16, 20, 17, 6, 22, 18, 25, 21,
    29, 17, 8, 10, 24, 11, 19, 13, 26, 16,
    17, 28, 15, 21, 23, 17, 22, 18, 26,
    27, 30, 20, 25, 17, 30, 14, 28, 19
  ];

  let seq;
  if (stageId === 3) seq = sequenceMegaHard;
  else if (stageId === 2) seq = sequenceHard;
  else seq = sequenceEasy;

  let currentX = 600;
  for (let i = 0; i < seq.length && currentX < TOTAL_DISTANCE - 400; i++) {
    const advance = spawnFixedPattern(seq[i], currentX);
    currentX += advance;
  }
}

function startGame(stageId) {
  currentStage = stageId;
  isHolding = false;
  player.reset();
  cameraX = 0;
  startTime = performance.now();

  // === 時間管理用の変数をリセット ===
  lastTime = performance.now();
  accumulator = 0;

  buildFullStage(stageId);

  if (currentAudio) currentAudio.pause();
  if (stageId === 1) currentAudio = BGM_STAGE_1;
  else if (stageId === 2) currentAudio = BGM_STAGE_2;
  else currentAudio = BGM_STAGE_3;
  
  currentAudio.currentTime = 0;
  currentAudio.play().catch(e => console.log("Audio play blocked", e));

  document.getElementById('select-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');

  gameState = 'PLAYING';
  requestAnimationFrame(gameLoop);
}

function showMenu() {
  gameState = 'MENU';
  if (currentAudio) currentAudio.pause();

  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('select-screen').classList.remove('hidden');
  document.getElementById('hud').classList.add('hidden');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// === 端末による速度差をなくす新しいゲームループ ===
function gameLoop(timestamp) {
  if (gameState !== 'PLAYING') return;

  // timestampが未定義の場合は補完
  if (!timestamp) timestamp = performance.now();

  // 前回フレームからの経過時間を計算
  let deltaTime = timestamp - lastTime;
  lastTime = timestamp;

  // タブ切り替え等で時間が開きすぎた場合のワープ（異常挙動）を防ぐ上限値
  if (deltaTime > 100) deltaTime = 100;

  accumulator += deltaTime;

  // 16.66ms（60FPS）溜まるごとに、PC版と同じスピードで1回分の処理を進める
  while (accumulator >= TIME_STEP) {
    update();
    accumulator -= TIME_STEP;
  }

  draw();
  requestAnimationFrame(gameLoop);
}

function update() {
  if (isHolding && player.energy > 0) {
    player.vy += THRUST * player.gravityMultiplier;
    if (player.gravityMultiplier === 1) {
      if (player.vy < -6.5) player.vy = -6.5;
    } else {
      if (player.vy > 6.5) player.vy = 6.5;
    }
    player.energy = Math.max(0, player.energy - 0.8);
    player.isGrounded = false;
  } else {
    player.vy += GRAVITY * player.gravityMultiplier;
    if (player.gravityMultiplier === 1) {
      if (player.vy > 7.5) player.vy = 7.5;
    } else {
      if (player.vy < -7.5) player.vy = -7.5;
    }
  }

  player.y += player.vy;

  if (player.gravityMultiplier === 1) {
    if (player.y >= FLOOR_Y - player.radius) {
      player.y = FLOOR_Y - player.radius;
      player.vy = 0;
      player.isGrounded = true;
    }
    if (player.y <= player.radius) {
      player.y = player.radius;
      player.vy = 0;
    }
  } else {
    if (player.y <= CEILING_Y + player.radius) {
      player.y = CEILING_Y + player.radius;
      player.vy = 0;
      player.isGrounded = true;
    }
    if (player.y >= FLOOR_Y - player.radius) {
      player.y = FLOOR_Y - player.radius;
      player.vy = 0;
    }
  }

  if (player.isGrounded) {
    player.energy = Math.min(player.maxEnergy, player.energy + 1.2);
  }

  cameraX += FIXED_SPEED;

  const elapsedSec = (performance.now() - startTime) / 1000;
  const progress = Math.min((cameraX / TOTAL_DISTANCE) * 100, 100);
  document.getElementById('progress-bar').style.width = `${progress}%`;
  document.getElementById('score-display').textContent = `COINS: ${coinsCollected}`;

  if (elapsedSec >= STAGE_DURATION_SEC || cameraX >= TOTAL_DISTANCE) {
    endGame(true, 100);
    return;
  }

  const playerScreenX = player.x;

  for (let it of items) {
    if (it.collected) continue;
    const itScreenX = it.x - cameraX + playerScreenX;
    const dist = Math.hypot(playerScreenX - itScreenX, player.y - it.y);

    if (dist < player.radius + 12) {
      it.collected = true;
      if (it.type === 'coin') {
        coinsCollected++;
      } else if (it.type === 'potion') {
        player.energy = Math.min(player.maxEnergy, player.energy + 40);
      }
    }
  }

  for (let obs of obstacles) {
    const obsScreenX = obs.x - cameraX + playerScreenX;

    if (obsScreenX > canvas.width + 50 || obsScreenX + (obs.w || obs.size) < -50) continue;

    if (obs.type === 'spike') {
      const spikeCenterX = obsScreenX + obs.size / 2;
      const spikeCenterY = obs.isCeiling ? obs.size / 2 : FLOOR_Y - obs.size / 2;
      const dist = Math.hypot(playerScreenX - spikeCenterX, player.y - spikeCenterY);

      if (dist < player.radius + 7) {
        endGame(false, progress);
        return;
      }
    } else if (obs.type === 'block') {
      const closestX = Math.max(obsScreenX, Math.min(playerScreenX, obsScreenX + obs.w));
      const closestY = Math.max(obs.y, Math.min(player.y, obs.y + obs.h));
      const distSq = (playerScreenX - closestX) ** 2 + (player.y - closestY) ** 2;

      if (distSq < player.radius * player.radius) {
        if (player.gravityMultiplier === 1) {
          if (player.vy >= 0 && player.y < obs.y + 12) {
            player.y = obs.y - player.radius;
            player.vy = 0;
            player.isGrounded = true;
          } else {
            endGame(false, progress);
            return;
          }
        } else {
          if (player.vy <= 0 && player.y > obs.y + obs.h - 12) {
            player.y = obs.y + obs.h + player.radius;
            player.vy = 0;
            player.isGrounded = true;
          } else {
            endGame(false, progress);
            return;
          }
        }
      }
    } else if (obs.type === 'jumppad') {
      if (
        playerScreenX + player.radius > obsScreenX &&
        playerScreenX - player.radius < obsScreenX + obs.w
      ) {
        if (obs.isCeiling) {
          if (player.y - player.radius <= obs.y + obs.h && player.gravityMultiplier === -1) {
            player.vy = 12.5;
            player.energy = Math.min(player.maxEnergy, player.energy + 15);
            player.isGrounded = false;
          }
        } else {
          if (player.y + player.radius >= obs.y && player.gravityMultiplier === 1) {
            player.vy = -12.5;
            player.energy = Math.min(player.maxEnergy, player.energy + 15);
            player.isGrounded = false;
          }
        }
      }
    } else if (obs.type === 'portal') {
      if (playerScreenX > obsScreenX + obs.w / 2 && !obs.activated) {
        player.gravityMultiplier *= -1;
        obs.activated = true;
      }
    }
  }
}

function endGame(isClear, progressPercent) {
  gameState = isClear ? 'CLEAR' : 'GAMEOVER';
  if (currentAudio) currentAudio.pause();

  document.getElementById('hud').classList.add('hidden');
  const resultScreen = document.getElementById('result-screen');
  const title = document.getElementById('result-title');
  const detail = document.getElementById('result-detail');

  if (isClear) {
    title.textContent = "STAGE CLEAR!!";
    title.style.color = "#00ff66";
    title.style.textShadow = "0 0 15px #00ff66";
    detail.textContent = `90秒間完走達成！ 獲得コイン: ${coinsCollected}`;
  } else {
    title.textContent = "GAME OVER";
    title.style.color = "#ff0055";
    title.style.textShadow = "0 0 15px #ff0055";
    detail.textContent = `進行度: ${Math.floor(progressPercent)}% | コイン: ${coinsCollected}`;
  }

  resultScreen.classList.remove('hidden');
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#0a2240';
  ctx.fillRect(0, FLOOR_Y, canvas.width, canvas.height - FLOOR_Y);
  ctx.strokeStyle = '#00fff0';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, FLOOR_Y);
  ctx.lineTo(canvas.width, FLOOR_Y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, CEILING_Y);
  ctx.lineTo(canvas.width, CEILING_Y);
  ctx.stroke();

  for (let obs of obstacles) {
    const obsScreenX = obs.x - cameraX + player.x;
    if (obsScreenX < -100 || obsScreenX > canvas.width + 100) continue;

    if (obs.type === 'portal') {
      ctx.fillStyle = obs.activated ? 'rgba(200, 0, 255, 0.1)' : 'rgba(200, 0, 255, 0.4)';
      ctx.fillRect(obsScreenX, CEILING_Y, obs.w, FLOOR_Y - CEILING_Y);
      ctx.strokeStyle = '#d500f9';
      ctx.lineWidth = 2;
      ctx.strokeRect(obsScreenX, CEILING_Y, obs.w, FLOOR_Y - CEILING_Y);
    }
  }

  for (let it of items) {
    if (it.collected) continue;
    const itScreenX = it.x - cameraX + player.x;
    if (itScreenX < -50 || itScreenX > canvas.width + 50) continue;

    if (it.type === 'coin') {
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(itScreenX, it.y, 7, 0, Math.PI * 2);
      ctx.fill();
    } else if (it.type === 'potion') {
      ctx.fillStyle = '#00ff66';
      ctx.beginPath();
      ctx.arc(itScreenX, it.y, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  for (let obs of obstacles) {
    const obsScreenX = obs.x - cameraX + player.x;
    if (obsScreenX < -100 || obsScreenX > canvas.width + 100) continue;

    if (obs.type === 'spike') {
      ctx.fillStyle = '#ff0055';
      ctx.beginPath();
      if (obs.isCeiling) {
        ctx.moveTo(obsScreenX, 0);
        ctx.lineTo(obsScreenX + obs.size / 2, obs.size);
        ctx.lineTo(obsScreenX + obs.size, 0);
      } else {
        ctx.moveTo(obsScreenX, obs.y);
        ctx.lineTo(obsScreenX + obs.size / 2, obs.y - obs.size);
        ctx.lineTo(obsScreenX + obs.size, obs.y);
      }
      ctx.closePath();
      ctx.fill();
    } else if (obs.type === 'block') {
      ctx.fillStyle = '#d63447';
      ctx.fillRect(obsScreenX, obs.y, obs.w, obs.h);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(obsScreenX, obs.y, obs.w, obs.h);
    } else if (obs.type === 'jumppad') {
      ctx.fillStyle = '#00ff66';
      ctx.fillRect(obsScreenX, obs.y, obs.w, obs.h);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.strokeRect(obsScreenX, obs.y, obs.w, obs.h);

      ctx.fillStyle = '#000000';
      ctx.beginPath();
      if (obs.isCeiling) {
        ctx.moveTo(obsScreenX + obs.w/2, obs.y + obs.h - 2);
        ctx.lineTo(obsScreenX + obs.w/2 - 8, obs.y + obs.h - 9);
        ctx.lineTo(obsScreenX + obs.w/2 + 8, obs.y + obs.h - 9);
      } else {
        ctx.moveTo(obsScreenX + obs.w/2, obs.y + 2);
        ctx.lineTo(obsScreenX + obs.w/2 - 8, obs.y + 9);
        ctx.lineTo(obsScreenX + obs.w/2 + 8, obs.y + 9);
      }
      ctx.closePath();
      ctx.fill();
    }
  }

  ctx.save();
  ctx.translate(player.x, player.y);
  
  if (player.gravityMultiplier === -1) {
    ctx.scale(1, -1);
  }

  if (isHolding && player.energy > 0) {
    ctx.fillStyle = '#ff9900';
    ctx.beginPath();
    ctx.moveTo(-5, player.radius - 2);
    ctx.lineTo(0, player.radius + 10);
    ctx.lineTo(5, player.radius - 2);
    ctx.closePath();
    ctx.fill();
  }

  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(4, -3, 2.5, 0, Math.PI * 2);
  ctx.arc(-4, -3, 2.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
  ctx.fillRect(20, 20, 150, 16);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1;
  ctx.strokeRect(20, 20, 150, 16);

  const energyRatio = player.energy / player.maxEnergy;
  ctx.fillStyle = energyRatio > 0.25 ? '#00e5ff' : '#ff3300';
  ctx.fillRect(22, 22, 146 * energyRatio, 12);
}
